services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD debe estar definido en .env}}
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME debe estar definido en .env}
      MYSQL_USER: ${DB_USER:?DB_USER debe estar definido en .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD debe estar definido en .env}
    volumes:
      # Las tablas las crea la web al arrancar (migraciones en src/db/migraciones).
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build: .
    restart: unless-stopped
    # Como mucho 2 de los 4 núcleos de la Pi: el resto de servicios sigue respondiendo.
    cpus: 2.0
    # Solo accesible desde la propia máquina: Tailscale Funnel es la única entrada.
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: production
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  db_data:
    name: tfg-frikicoments_db_data
