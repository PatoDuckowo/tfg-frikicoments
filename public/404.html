<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#212529">
  <link rel="icon" href="/img/icono.svg">
  <link rel="apple-touch-icon" href="/img/icono-192.png">
  <title>404 - Página no encontrada | Frikicoments</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="escena-login" aria-hidden="true"></div>
  <main class="container error-container">
    <header class="cabecera-pagina">
      <div class="cabecera-pagina-textos">
        <a class="logo-enlace logo-sitio" href="/" title="Ir a la portada">Frikicoments</a>
        <h1>¡Te has perdido!</h1>
        <p>Parece que esta página no está en el mapa.</p>
      </div>
      <nav class="cabecera-nav" aria-label="Navegación principal" data-menu="publico"></nav>
    </header>

    <section class="card not-found-card" aria-labelledby="error-code">
      <span class="badge">Pantalla de error</span>
      <h2 class="error-code" id="error-code">404</h2>
      <p class="error-description">El enlace puede estar mal escrito o esta página ya no existe.</p>
      <a class="btn primary" href="/">Volver al inicio</a>
    </section>
  </main>
  <script type="module" src="/js/comun.js"></script>
</body>
</html>
