<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#212529">
  <link rel="icon" href="/img/icono.svg">
  <link rel="apple-touch-icon" href="/img/icono-192.png">
  <title>Resultados - Frikicoments</title>
  
  <!-- Fuente Pixel Art -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <!-- Estilos CSS externos -->
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/catalogo.css">
</head>
<body>
  <div class="escena-login" aria-hidden="true"></div>

  <header class="cabecera-pagina">
    <div class="cabecera-pagina-textos">
      <a class="logo-enlace logo-sitio" href="/" title="Ir a la portada">Frikicoments</a>
      <h1>Resultados para: <span id="query-title"></span></h1>
    </div>
    <nav class="cabecera-nav" aria-label="Navegación principal" data-menu=""></nav>
  </header>

  <main class="resultados-busqueda">
    <div id="grid-juegos" class="grid">
      <p class="status-msg">Buscando videojuegos...</p>
    </div>

    <div class="paginacion">
      <button id="btn-prev" class="btn-pag" type="button">&lt; Anterior</button>
      <span id="num-pagina">Página 1</span>
      <button id="btn-next" class="btn-pag" type="button">Siguiente &gt;</button>
    </div>
  </main>

  <script type="module" src="/js/paginas/resultados.js"></script>
</body>
</html>
