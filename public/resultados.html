<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultados de Búsquedas</title>
  
  <!-- Fuente Pixel Art -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <!-- Estilos CSS externos -->
  <link rel="stylesheet" href="/css/styles.css?v=20261004-3">
  <link rel="stylesheet" href="/css/catalogo.css?v=20260831-1">
</head>
<body>
  <div class="escena-login" aria-hidden="true"></div>

  <header class="cabecera-pagina">
    <div class="cabecera-pagina-textos">
      <a class="logo-enlace logo-sitio" href="/" title="Ir a la portada">Frikicoments</a>
      <h1>Resultados para: <span id="query-title"></span></h1>
    </div>
    <nav class="cabecera-nav" aria-label="Navegación principal">
      <a class="btn primary" href="/">Portada</a>
      <a class="btn primary" href="/usuarios/biblioteca.html">Mi biblioteca</a>
      <a class="btn primary" href="/usuarios/archivos.html">Mis archivos</a>
      <a class="btn primary" href="/usuarios/mi-cuenta.html">Mi cuenta</a>
    </nav>
  </header>

  <main class="resultados-busqueda">
    <div id="grid-juegos" class="grid">
      <p class="status-msg">Buscando videojuegos...</p>
    </div>

    <div class="paginacion">
      <button id="btn-prev" class="btn-pag">← Anterior</button>
      <span id="num-pagina">Página 1</span>
      <button id="btn-next" class="btn-pag">Siguiente →</button>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const query = params.get('q') || '';
    let currentPage = parseInt(params.get('page')) || 1;

    document.getElementById('query-title').textContent = query ? `"${query}"` : '(vacío)';
    document.getElementById('num-pagina').textContent = `Página ${currentPage}`;

    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const grid = document.getElementById('grid-juegos');

    btnPrev.disabled = currentPage <= 1;

    btnPrev.addEventListener('click', () => {
      if (currentPage > 1) {
        window.location.href = `/resultados?q=${encodeURIComponent(query)}&page=${currentPage - 1}`;
      }
    });

    btnNext.addEventListener('click', () => {
      window.location.href = `/resultados?q=${encodeURIComponent(query)}&page=${currentPage + 1}`;
    });

    async function cargarResultados() {
      if (!query) {
        mostrarMensaje('No se especificó ningún término de búsqueda.');
        btnPrev.disabled = true;
        btnNext.disabled = true;
        return;
      }

      try {
        const res = await fetch(`/api/juegos/buscar?q=${encodeURIComponent(query)}&page=${currentPage}`);
        const juegos = await res.json();

        if (!Array.isArray(juegos) || juegos.length === 0) {
          mostrarMensaje('No se encontraron más resultados.');
          btnNext.disabled = true;
          return;
        }

        if (juegos.length < 12) {
          btnNext.disabled = true;
        }

        grid.replaceChildren();
        juegos.forEach(juego => {
          const imagenUrl = juego.background_image || 'https://via.placeholder.com/260x330?text=Sin+Caratula';
          
          const card = document.createElement('div');
          card.className = 'card juego-card';
          card.setAttribute('role', 'link');
          card.tabIndex = 0;
          const portada = document.createElement('div');
          portada.className = 'card-cover';
          const imagen = document.createElement('img');
          imagen.src = imagenUrl;
          imagen.alt = juego.name || 'Carátula del juego';
          imagen.loading = 'lazy';
          portada.append(imagen);

          const cuerpo = document.createElement('div');
          cuerpo.className = 'card-body';
          const titulo = document.createElement('div');
          titulo.className = 'card-title';
          titulo.title = juego.name || '';
          titulo.textContent = juego.name || 'Juego sin título';
          const metadatos = document.createElement('div');
          metadatos.className = 'card-meta';
          const lanzamiento = document.createElement('span');
          lanzamiento.textContent = juego.released || 'N/A';
          const valoracion = document.createElement('span');
          valoracion.className = 'rating';
          valoracion.textContent = `★ ${juego.rating || 'N/D'}`;
          metadatos.append(lanzamiento, valoracion);
          cuerpo.append(titulo, metadatos);
          card.append(portada, cuerpo);
          const abrirFicha = () => {
            window.location.href = `/juego.html?id=${encodeURIComponent(juego.id)}`;
          };
          card.addEventListener('click', abrirFicha);
          card.addEventListener('keydown', evento => {
            if (evento.key === 'Enter' || evento.key === ' ') {
              evento.preventDefault();
              abrirFicha();
            }
          });
          grid.appendChild(card);
        });

      } catch (err) {
        mostrarMensaje(`Error al cargar resultados: ${err.message}`, true);
      }
    }

    function mostrarMensaje(texto, esError = false) {
      const mensaje = document.createElement('p');
      mensaje.className = 'status-msg';
      if (esError) mensaje.style.color = 'var(--accent-red, #ef4444)';
      mensaje.textContent = texto;
      grid.replaceChildren(mensaje);
    }

    cargarResultados();
  </script>
</body>
</html>
