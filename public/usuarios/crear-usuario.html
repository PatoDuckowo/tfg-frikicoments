<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitar usuario - Frikicoments</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="escena-login" aria-hidden="true"></div>
  <main class="container">
    <header class="cabecera-pagina">
      <div class="cabecera-pagina-textos">
        <a class="logo-enlace logo-sitio" href="/" title="Ir a la portada">Frikicoments</a>
        <h1>Invitar usuario</h1>
        <p>Solo una persona con sesión iniciada puede crear una cuenta. No hay registro público.</p>
      </div>
      <nav class="cabecera-nav" aria-label="Navegación principal" data-menu=""></nav>
    </header>

    <section class="card">
      <h2 class="panel-title">Nueva cuenta</h2>
      <p class="ayuda-formulario">Crea la cuenta y comparte la contraseña inicial en privado con la persona invitada.</p>
      <form class="form-box formulario-cuenta" id="form-crear-usuario">
        <label for="usuario">Nombre de usuario</label>
        <input id="usuario" name="usuario" type="text" minlength="3" maxlength="30" placeholder="De 3 a 30: letras, números, - _ ." autocomplete="off" required>

        <label for="contrasena">Contraseña inicial para la persona invitada</label>
        <input id="contrasena" name="contrasena" type="password" minlength="8" placeholder="Mínimo 8 caracteres" autocomplete="new-password" required>

        <label for="confirmar-contrasena">Repetir contraseña</label>
        <input id="confirmar-contrasena" name="confirmar-contrasena" type="password" minlength="8" placeholder="Repite la contraseña" autocomplete="new-password" required>

        <button class="btn primary" type="submit">Crear cuenta invitada</button>
        <p class="auth-message" id="mensaje" role="status" aria-live="polite"></p>
      </form>
    </section>

  </main>
  <script type="module" src="/js/paginas/crear-usuario.js"></script>
</body>
</html>
