<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear usuario - Frikicoments</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Crear usuario</h1>
      <p>Formulario para registrar una nueva cuenta.</p>
    </header>

    <section class="card">
      <form class="form-box" action="#" method="post">
        <label for="nombre">Nombre de usuario</label>
        <input id="nombre" name="nombre" type="text" placeholder="Escribe tu nombre">

        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" placeholder="usuario@correo.com">

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" placeholder="Escribe una contraseña">

        <label for="confirmar-password">Repetir contraseña</label>
        <input id="confirmar-password" name="confirmar-password" type="password" placeholder="Repite la contraseña">

        <button class="btn primary" type="submit">Crear usuario</button>
      </form>
    </section>

    <p><a class="btn-volver" href="usuarios.html">Volver a usuarios</a></p>
  </main>
</body>
</html>
