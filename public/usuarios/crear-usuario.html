<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitar usuario - Frikicoments</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Invitar usuario</h1>
      <p>Solo una persona con sesión iniciada puede crear una cuenta. No hay registro público.</p>
    </header>

    <section class="card">
      <form class="form-box" id="form-crear-usuario">
        <label for="usuario">Nombre de usuario</label>
        <input id="usuario" name="usuario" type="text" minlength="3" autocomplete="username" required>

        <label for="contrasena">Contraseña inicial para la persona invitada</label>
        <input id="contrasena" name="contrasena" type="password" minlength="8" autocomplete="new-password" required>

        <label for="confirmar-contrasena">Repetir contraseña</label>
        <input id="confirmar-contrasena" name="confirmar-contrasena" type="password" minlength="8" autocomplete="new-password" required>

        <button class="btn primary" type="submit">Crear cuenta invitada</button>
        <p class="auth-message" id="mensaje" role="status" aria-live="polite"></p>
      </form>
    </section>

    <p><a class="btn-volver" href="../inicio.html">Volver al inicio</a></p>
  </main>
  <script>
    const formulario = document.querySelector('#form-crear-usuario');
    const mensaje = document.querySelector('#mensaje');

    formulario.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      mensaje.classList.remove('error');

      if (formulario.contrasena.value !== formulario['confirmar-contrasena'].value) {
        mensaje.textContent = 'Las contraseñas no coinciden.';
        mensaje.classList.add('error');
        return;
      }

      try {
        const respuesta = await fetch('/api/usuarios/registro', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({
            usuario: formulario.usuario.value,
            contrasena: formulario.contrasena.value
          })
        });
        const datos = await respuesta.json();
        if (!respuesta.ok) throw new Error(datos.error || 'No se pudo crear el usuario.');

        formulario.reset();
        mensaje.textContent = 'Cuenta creada en MySQL. Comparte las credenciales iniciales solo con la persona invitada.';
      } catch (error) {
        mensaje.textContent = error.message;
        mensaje.classList.add('error');
      }
    });
  </script>
</body>
</html>
