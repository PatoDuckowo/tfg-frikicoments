<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#212529">
  <link rel="icon" href="/img/icono.svg">
  <link rel="apple-touch-icon" href="/img/icono-192.png">
  <title>Mis archivos - Frikicoments</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="escena-login" aria-hidden="true"></div>
  <main class="container">
    <header class="cabecera-pagina">
      <div class="cabecera-pagina-textos">
        <a class="logo-enlace logo-sitio" href="/" title="Ir a la portada">Frikicoments</a>
        <h1>Mis archivos</h1>
        <p>Tu espacio privado de Frikicoments.</p>
      </div>
      <nav class="cabecera-nav" aria-label="Navegación principal" data-menu="archivos"></nav>
    </header>

    <section class="explorador-toolbar" aria-label="Herramientas de archivos">
      <label class="btn primary selector-archivo" for="archivo-input">Subir archivo</label>
      <input id="archivo-input" type="file" hidden>
    </section>

    <section class="explorador-cuota" aria-label="Espacio utilizado">
      <div class="cuota-cabecera">
        <strong>Este equipo</strong>
        <span id="cuota-texto">Calculando espacio...</span>
      </div>
      <div class="cuota-barra"><span id="cuota-progreso"></span></div>
      <p id="mensaje-archivo" class="auth-message" role="status" aria-live="polite"></p>
    </section>

    <section class="explorador-panel">
      <div class="explorador-panel-cabecera">
        <h2>Archivos</h2>
        <span id="contador-archivos">0 elementos</span>
      </div>
      <div class="archivos-lista" id="archivos-lista" aria-live="polite"></div>
    </section>
  </main>

  <script type="module" src="/js/paginas/archivos.js"></script>
</body>
</html>
