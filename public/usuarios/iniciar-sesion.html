<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Frikicoments</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Iniciar sesión</h1>
      <p>Accede a tu cuenta de Frikicoments.</p>
    </header>

    <section class="card">
      <form class="form-box" action="#" method="post">
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" placeholder="usuario@correo.com">

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" placeholder="Escribe tu contraseña">

        <button class="btn primary" type="submit">Entrar</button>
      </form>
    </section>

    <p><a class="btn-volver" href="crear-usuario.html">Crear una cuenta</a></p>
    <p><a class="btn-volver" href="usuarios.html">Volver a usuarios</a></p>
  </main>
</body>
</html>
