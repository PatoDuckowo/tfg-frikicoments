<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi cuenta - Frikicoments</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Mi cuenta</h1>
      <p>Datos y opciones del usuario conectado.</p>
    </header>

    <section class="card">
      <h2 class="panel-title">Datos personales</h2>
      <p>Has iniciado sesión como <strong id="nombre-usuario">...</strong>.</p>
      <p>¡Bienvenido a Frikicoments!</p>
    </section>

    <section class="card" style="margin-top: 24px;">
      <h2 class="panel-title">Sesión</h2>
      <p><a class="btn primary" href="archivos.html">Mis archivos</a></p>
      <p><a class="btn primary" href="biblioteca.html">Mi biblioteca</a></p>
      <p><a class="btn primary" href="cambiar-contrasena.html">Cambiar contraseña</a></p>
      <form action="/api/usuarios/logout" method="post">
        <button class="btn secondary" type="submit">Cerrar sesión</button>
      </form>
    </section>

    <section class="card" id="panel-superadmin" style="margin-top: 24px; display: none;">
      <h2 class="panel-title">Superadministración</h2>
      <p>Gestiona las contraseñas de las cuentas.</p>
      <a class="btn primary" href="superadmin.html">Gestionar usuarios</a>
    </section>

    <p><a class="btn-volver" href="/">Volver a la home</a></p>
  </main>
  <script>
    fetch('/api/usuarios/me')
      .then(respuesta => respuesta.json())
      .then(datos => {
        document.querySelector('#nombre-usuario').textContent = datos.usuario;
        if (datos.esAdministrador) {
          document.querySelector('#panel-superadmin').style.display = 'block';
        }
      })
      .catch(() => {
        window.location.href = '/usuarios/iniciar-sesion.html';
      });
  </script>
</body>
</html>
