<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Superadministración - Frikicoments</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Superadministración</h1>
      <p>Gestiona las contraseñas de las cuentas.</p>
    </header>

    <section class="card">
      <h2 class="panel-title">Cuentas de usuarios</h2>
      <p id="mensaje" class="auth-message" role="status" aria-live="polite"></p>
      <div id="lista-usuarios"></div>
    </section>

    <p><a class="btn-volver" href="mi-cuenta.html">Volver a mi cuenta</a></p>
  </main>
  <script>
    const lista = document.querySelector('#lista-usuarios');
    const mensaje = document.querySelector('#mensaje');

    function mostrarUsuarios(usuarios) {
      lista.replaceChildren();
      usuarios.forEach(usuario => {
        const tarjeta = document.createElement('article');
        tarjeta.className = 'card';
        tarjeta.style.marginTop = '16px';
        const datos = document.createElement('p');
        const nombre = document.createElement('strong');
        nombre.textContent = usuario.nombre_usuario;
        datos.append(nombre, document.createTextNode(` (${usuario.rol})`));
        const formulario = document.createElement('form');
        formulario.className = 'form-box';
        formulario.dataset.id = usuario.id;
        const etiqueta = document.createElement('label');
        etiqueta.htmlFor = `contrasena-${usuario.id}`;
        etiqueta.textContent = 'Nueva contraseña';
        const entrada = document.createElement('input');
        entrada.id = `contrasena-${usuario.id}`;
        entrada.name = 'contrasena';
        entrada.type = 'password';
        entrada.minLength = 8;
        entrada.autocomplete = 'new-password';
        entrada.required = true;
        const boton = document.createElement('button');
        boton.className = 'btn primary';
        boton.type = 'submit';
        boton.textContent = 'Restablecer contraseña';
        formulario.append(etiqueta, entrada, boton);
        tarjeta.append(datos, formulario);
        lista.append(tarjeta);
      });
    }

    async function cargarUsuarios() {
      const respuesta = await fetch('/api/superadmin/usuarios');
      if (!respuesta.ok) throw new Error('No se pudieron cargar las cuentas.');
      mostrarUsuarios(await respuesta.json());
    }

    lista.addEventListener('submit', async evento => {
      evento.preventDefault();
      const formulario = evento.target;
      const boton = formulario.querySelector('button');
      boton.disabled = true;
      mensaje.textContent = 'Guardando...';

      try {
        const respuesta = await fetch(`/api/superadmin/usuarios/${formulario.dataset.id}/contrasena`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contrasena: formulario.contrasena.value })
        });
        const datos = await respuesta.json();
        if (!respuesta.ok) throw new Error(datos.error || 'No se pudo cambiar la contraseña.');
        formulario.reset();
        mensaje.textContent = 'Contraseña actualizada.';
      } catch (error) {
        mensaje.textContent = error.message;
        mensaje.classList.add('error');
      } finally {
        boton.disabled = false;
      }
    });

    cargarUsuarios().catch(() => {
      window.location.href = '/usuarios/iniciar-sesion.html';
    });
  </script>
</body>
</html>
