<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambiar contraseña - Frikicoments</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Cambiar contraseña</h1>
      <p>Formulario para actualizar la contraseña de la cuenta.</p>
    </header>

    <section class="card">
      <form class="form-box" id="form-cambiar-contrasena">
        <label for="password-actual">Contraseña actual</label>
        <input id="password-actual" name="password-actual" type="password" placeholder="Escribe tu contraseña actual" autocomplete="current-password" required>

        <label for="password-nueva">Contraseña nueva</label>
        <input id="password-nueva" name="password-nueva" type="password" minlength="8" placeholder="Escribe la nueva contraseña" autocomplete="new-password" required>

        <label for="confirmar-password-nueva">Repetir contraseña nueva</label>
        <input id="confirmar-password-nueva" name="confirmar-password-nueva" type="password" minlength="8" placeholder="Repite la nueva contraseña" autocomplete="new-password" required>

        <button class="btn primary" type="submit">Guardar contraseña</button>
        <p class="auth-message" id="mensaje" role="status" aria-live="polite"></p>
      </form>
    </section>

    <p><a class="btn-volver" href="mi-cuenta.html">Volver a mi cuenta</a></p>
  </main>
  <script>
    const formulario = document.querySelector('#form-cambiar-contrasena');
    const mensaje = document.querySelector('#mensaje');

    formulario.addEventListener('submit', async evento => {
      evento.preventDefault();
      mensaje.classList.remove('error');

      if (formulario['password-nueva'].value !== formulario['confirmar-password-nueva'].value) {
        mensaje.textContent = 'Las contraseñas nuevas no coinciden.';
        mensaje.classList.add('error');
        return;
      }

      try {
        const respuesta = await fetch('/api/usuarios/password', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contrasenaActual: formulario['password-actual'].value,
            contrasenaNueva: formulario['password-nueva'].value
          })
        });
        const datos = await respuesta.json();
        if (!respuesta.ok) throw new Error(datos.error || 'No se pudo cambiar la contraseña.');
        mensaje.textContent = datos.mensaje;
        window.setTimeout(() => {
          window.location.href = 'iniciar-sesion.html';
        }, 1200);
      } catch (error) {
        mensaje.textContent = error.message;
        mensaje.classList.add('error');
      }
    });
  </script>
</body>
</html>
