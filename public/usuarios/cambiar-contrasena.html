<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambiar contraseña - Frikicoments</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Cambiar contraseña</h1>
      <p>Formulario para actualizar la contraseña de la cuenta.</p>
    </header>

    <section class="card">
      <form class="form-box" action="#" method="post">
        <label for="password-actual">Contraseña actual</label>
        <input id="password-actual" name="password-actual" type="password" placeholder="Escribe tu contraseña actual">

        <label for="password-nueva">Contraseña nueva</label>
        <input id="password-nueva" name="password-nueva" type="password" placeholder="Escribe la nueva contraseña">

        <label for="confirmar-password-nueva">Repetir contraseña nueva</label>
        <input id="confirmar-password-nueva" name="confirmar-password-nueva" type="password" placeholder="Repite la nueva contraseña">

        <button class="btn primary" type="submit">Guardar contraseña</button>
      </form>
    </section>

    <p><a class="btn-volver" href="mi-cuenta.html">Volver a mi cuenta</a></p>
  </main>
</body>
</html>
