<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#212529">
  <link rel="icon" href="/img/icono.svg">
  <link rel="apple-touch-icon" href="/img/icono-192.png">
  <title>Cambiar contraseña - Frikicoments</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="escena-login" aria-hidden="true"></div>
  <main class="container">
    <header class="cabecera-pagina">
      <div class="cabecera-pagina-textos">
        <a class="logo-enlace logo-sitio" href="/" title="Ir a la portada">Frikicoments</a>
        <h1>Cambiar contraseña</h1>
        <p>Formulario para actualizar la contraseña de la cuenta.</p>
      </div>
      <nav class="cabecera-nav" aria-label="Navegación principal" data-menu="cuenta"></nav>
    </header>

    <section class="card">
      <h2 class="panel-title">Tu contraseña</h2>
      <p class="ayuda-formulario">Al guardarla se cerrarán tus sesiones en todos los dispositivos y tendrás que entrar con la nueva.</p>
      <form class="form-box formulario-cuenta" id="form-cambiar-contrasena">
        <label for="password-actual">Contraseña actual</label>
        <input id="password-actual" name="password-actual" type="password" placeholder="Escribe tu contraseña actual" autocomplete="current-password" required>

        <label for="password-nueva">Contraseña nueva</label>
        <input id="password-nueva" name="password-nueva" type="password" minlength="8" placeholder="Escribe la nueva contraseña" autocomplete="new-password" required>

        <label for="confirmar-password-nueva">Repetir contraseña nueva</label>
        <input id="confirmar-password-nueva" name="confirmar-password-nueva" type="password" minlength="8" placeholder="Repite la nueva contraseña" autocomplete="new-password" required>

        <button class="btn primary" type="submit">Guardar contraseña</button>
        <p class="auth-message" id="mensaje" role="status" aria-live="polite"></p>
      </form>
    </section>

  </main>
  <script type="module" src="/js/paginas/cambiar-contrasena.js"></script>
</body>
</html>
