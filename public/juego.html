<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#212529">
  <link rel="icon" href="/img/icono.svg">
  <link rel="apple-touch-icon" href="/img/icono-192.png">
  <title>Juego - Frikicoments</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css?v=20261004-5">
  <link rel="stylesheet" href="/css/catalogo.css?v=20260927-2">
</head>
<body>
  <div class="escena-login" aria-hidden="true"></div>
  <header class="cabecera-pagina">
    <div class="cabecera-pagina-textos">
      <a class="logo-enlace logo-sitio" href="/" title="Ir a la portada">Frikicoments</a>
      <h1 id="titulo-juego">Cargando juego...</h1>
    </div>
    <nav class="cabecera-nav" aria-label="Navegación principal" data-menu="" data-volver></nav>
  </header>

  <main class="detalle-juego">
    <section class="detalle-cabecera card">
      <div class="detalle-portada" id="portada-juego"></div>
      <div class="detalle-info">
        <p id="meta-juego" class="card-meta"></p>
        <h2 class="panel-title">Resumen</h2>
        <p id="resumen-juego">Cargando resumen...</p>
        <p id="mensaje-juego" class="auth-message" role="status" aria-live="polite"></p>
      </div>
    </section>

    <section class="card detalle-estado">
      <h2 class="panel-title">Mi estado</h2>
      <p>Guarda cómo te relacionas con este juego.</p>
      <label for="estado-juego">Estado</label>
      <select id="estado-juego">
        <option value="">Sin estado</option>
        <option value="pendiente">Pienso jugarlo</option>
        <option value="jugado">Lo he jugado</option>
        <option value="abandonado">Lo he abandonado</option>
      </select>
      <p id="mensaje-estado" class="auth-message" role="status" aria-live="polite"></p>
      <div class="juego-acciones">
        <button class="btn secondary" id="guardar-juego" type="button">Guardar juego</button>
        <button class="btn primary" id="me-gusta-juego" type="button">Me gusta</button>
      </div>
      <p id="mensaje-marcadores" class="auth-message" role="status" aria-live="polite"></p>
    </section>

    <section class="card detalle-comentarios">
      <h2 class="panel-title">Comentarios de la comunidad</h2>
      <form id="form-comentario" class="form-box">
        <label for="contenido-comentario">Escribe tu comentario</label>
        <textarea id="contenido-comentario" name="contenido" maxlength="5000" required></textarea>
        <button class="btn primary" type="submit">Publicar comentario</button>
        <p id="mensaje-comentario" class="auth-message" role="status" aria-live="polite"></p>
      </form>
      <div id="lista-comentarios" class="lista-comentarios"></div>
    </section>
  </main>

  <script type="module" src="/js/paginas/juego.js"></script>
</body>
</html>
