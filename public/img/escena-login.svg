  <rect x="98" y="44" width="34" height="12" fill="#0f1a33"/>
  <path d="M100 53 h4 v-5 h4 v5 h4 v-5 h4 v5 h4 v-5 h4 v5 h4" stroke="#79d98a" fill="none"/>
  <rect x="136" y="44" width="4" height="4" fill="#34507f"/>
  <rect x="142" y="44" width="4" height="4" fill="#34507f"/>
