<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges">
  <!-- Escena pixel art de la pantalla de inicio de sesión: laboratorio nocturno con un gato durmiendo. -->
  <style>
    .led { animation: parpadeo 1.6s steps(1) infinite; }
    .led.lento { animation-duration: 2.7s; }
    .led.rapido { animation-duration: 0.9s; }
    .cursor { animation: parpadeo 1s steps(1) infinite; }
    .pez { animation: nadar 9s ease-in-out infinite alternate; }
    .pez.dos { animation-duration: 12s; animation-delay: -4s; }
    .pez.tres { animation-duration: 7s; animation-delay: -2s; }
    .burbuja { animation: subir 4s linear infinite; }
    .burbuja.b2 { animation-delay: -1.5s; }
    .burbuja.b3 { animation-delay: -3s; }
    .medusa { animation: flotar 5s ease-in-out infinite; }
    .gato-cuerpo { transform-box: fill-box; transform-origin: bottom; animation: respirar 3.2s ease-in-out infinite; }
    .zeta { animation: dormir 4s ease-out infinite; opacity: 0; }
    .zeta.z2 { animation-delay: -2s; }
    @keyframes parpadeo { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    @keyframes nadar { from { transform: translateX(0); } to { transform: translateX(26px); } }
    @keyframes subir { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-38px); opacity: 0; } }
    @keyframes flotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes respirar { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.06); } }
    @keyframes dormir { 0% { transform: translate(0, 0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(8px, -16px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .zeta { opacity: 0.8; } }
  </style>

  <defs>
    <pattern id="celosia" width="8" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 4.5 L4 0.5 L8 4.5" stroke="#3f5f92" fill="none"/>
    </pattern>
    <radialGradient id="vineta" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <!-- Pared y tuberías -->
